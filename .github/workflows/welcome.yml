name: Zen Garden Welcomes

# Posts new-gardener welcome cards to #zengarden.
#   - Scheduled batches come from welcome_batches.json (ids + dates only;
#     answers are fetched from BambooHR at post time — never committed).
#   - State-driven like the daily runner: extra ticks no-op, a dropped
#     tick heals at the next one, a posted batch can never double-post.
#   - "armed" in welcome_batches.json gates the scheduled lane; manual
#     dispatch with an explicit batch id works regardless (for tests).

on:
  schedule:
    # Two engagement windows measured from real #zengarden reply activity
    # (analyzed 2026-11-22): lunch ~1pm ET and evening ~7pm ET. One
    # primary tick per window plus a healing tick 45 min later; batches
    # carry an "after" time so the evening batch never posts at lunch.
    - cron: '31 14 * * *'  # 9:31am EST (morning window / experiment)
    - cron: '1 15 * * *'   # 10:01am EST heal
    - cron: '7 18 * * *'   # 1:07pm EST (2:07pm EDT)
    - cron: '52 18 * * *'  # 1:52pm EST heal
    - cron: '7 0 * * *'    # 7:07pm EST (fires next UTC day; runner uses ET)
    - cron: '52 0 * * *'   # 7:52pm EST heal
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch id to post now (e.g. "1"); blank = whatever is due'
        required: false
        type: string
      dry_run:
        description: 'Dry run (compose + sanitized log, post nothing)'
        required: false
        type: boolean
        default: false

# Share the daily runner's group so state commits never race.
concurrency:
  group: zen-garden-daily
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install slack_sdk

      - name: Integration test gate (offline fixtures, posts nothing)
        run: python test_welcome_integration.py

      - name: Run welcome runner
        env:
          BAMBOOHR_API_KEY: ${{ secrets.BAMBOOHR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.batch }}" ]; then
            ARGS="$ARGS --batch ${{ inputs.batch }}"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval "python welcome_runner.py $ARGS"

      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Zen Garden Bot"
          git config user.email "bot@amigocareaba.com"
          git add posted_state.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Zen Garden: welcome state"
            git pull --rebase
            git push
          fi
