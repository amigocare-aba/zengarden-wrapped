name: Zen Garden Daily Runner

# The script itself decides what to do based on today's date:
#   - Sunday                  → post weekly leaderboard for current month
#   - 1st of any month        → post monthly Wrapped recap for previous month
#   - Any other day           → do nothing (silent no-op)
# Runs every day at 12pm ET so both types of posts land on time.

on:
  schedule:
    # Every day at 12pm ET
    # DST note: change to '0 17 * * *' after Nov 1, 2026 (when EST starts).
    #           change back to '0 16 * * *' after Mar 8, 2027 (when EDT resumes).
    - cron: '0 16 * * *'  # 16:00 UTC = 12pm EDT
  workflow_dispatch:
    inputs:
      simulate_date:
        description: 'Simulate a specific date (YYYY-MM-DD, leave blank for today)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (calculate but do not write files or post)'
        required: false
        type: boolean
        default: false
      force_weekly:
        description: 'Force a weekly leaderboard post regardless of day'
        required: false
        type: boolean
        default: false
      force_monthly:
        description: 'Force a monthly recap for this month label (e.g. "July 2026")'
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install slack_sdk

      - name: Run daily script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.simulate_date }}" ]; then
            ARGS="$ARGS --simulate-date ${{ inputs.simulate_date }}"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_weekly }}" == "true" ]; then
            ARGS="$ARGS --force-weekly"
          fi
          if [ -n "${{ inputs.force_monthly }}" ]; then
            ARGS="$ARGS --force-monthly \"${{ inputs.force_monthly }}\""
          fi
          eval "python zen_garden_weekly_auto.py $ARGS"

      - name: Commit and push results
        id: commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Zen Garden Bot"
          git config user.email "bot@amigocareaba.com"
          git add zen_garden_weekly.json run_status.json weekly_reports/ || true
          [ -f zen_garden_wrapped_data.json ] && git add zen_garden_wrapped_data.json || true
          [ -d monthly_reports ] && git add monthly_reports/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            ACTION=$(python -c "import json; d=json.load(open('run_status.json')); print(d.get('action', d.get('status','update')))")
            MONTH=$(python -c "import json; d=json.load(open('run_status.json')); print(d.get('month','')) " || echo "")
            git commit -m "Zen Garden: ${ACTION} · ${MONTH}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            # Extract the expected updated_at for post-deploy verification
            UPDATED_AT=$(python -c "import json; d=json.load(open('zen_garden_weekly.json')); print(d.get('updated_at',''))" 2>/dev/null || echo "")
            echo "expected_updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify live weekly.html reflects new JSON
        # Waits for GitHub Pages to redeploy and checks the served JSON matches
        # what we just committed. Fails the job if the site is stale after 5 min,
        # which triggers the failure alert to #wellnessprogram-group.
        if: ${{ inputs.dry_run != true && steps.commit.outputs.committed == 'true' && steps.commit.outputs.expected_updated_at != '' }}
        env:
          EXPECTED: ${{ steps.commit.outputs.expected_updated_at }}
        run: |
          echo "Waiting for Pages to serve updated_at=$EXPECTED ..."
          DEADLINE=$(( $(date +%s) + 300 ))
          while [ $(date +%s) -lt $DEADLINE ]; do
            # Cache-bust the JSON fetch
            LIVE=$(curl -s "https://amigocare-aba.github.io/zengarden-wrapped/zen_garden_weekly.json?ts=$(date +%s)" | python3 -c "import sys,json; print(json.load(sys.stdin).get('updated_at',''))" 2>/dev/null || echo "")
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "✅ Live page shows updated_at=$LIVE"
              exit 0
            fi
            echo "  ...still stale (live=$LIVE, want=$EXPECTED). Retrying in 20s."
            sleep 20
          done
          echo "::error::Pages never picked up the new JSON (expected updated_at=$EXPECTED)"
          exit 1

      # ── FAIL ALERT ────────────────────────────────────────────────
      # Runs ONLY if any previous step failed. Posts to private alerts channel.
      # Set SLACK_ALERT_WEBHOOK_URL in repo secrets to enable.
      - name: Post failure alert to Slack
        if: failure()
        env:
          ALERT_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_URL" ]; then
            echo "::warning::SLACK_ALERT_WEBHOOK_URL not set — skipping failure notification"
            exit 0
          fi
          MSG="⚠️ *Zen Garden daily run failed*\\n\\nWorkflow: \`${{ github.workflow }}\`\\nTriggered by: \`${{ github.event_name }}\`\\nDate: $(date -u '+%Y-%m-%d %H:%M UTC')\\n\\n<${RUN_URL}|View the failed run on GitHub>"
          curl -s -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"${MSG}\"}" \
            "$ALERT_URL" > /dev/null
          echo "Failure alert posted"
